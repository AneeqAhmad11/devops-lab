<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevOps Task Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    h1 { color: #1f4e79; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type=text] { flex: 1; padding: 8px; }
    button { padding: 8px 16px; background: #1f4e79; color: #fff; border: 0; cursor: pointer; }
    li { padding: 6px 0; border-bottom: 1px solid #ddd; }
    small { color: #777; }
  </style>
</head>
<body>
  <h1 id="page-title">DevOps Task Manager</h1>
  <small>Served by container: <span id="server-name">{{ host }}</span></small>

  <form action="/add" method="post">
    <input type="text" id="task-input" name="title" placeholder="Enter a task" required>
    <button type="submit" id="add-btn">Add</button>
  </form>

  <ul id="task-list">
    {% for t in tasks %}
    <li>{{ t[1] }}</li>
    {% endfor %}
  </ul>
</body>
</html>
