services:
  web:
    build: .
    container_name: task_web
    ports:
      - "80:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=tasksdb
      - DB_USER=postgres
      - DB_PASSWORD=secret
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    container_name: task_db
    environment:
      - POSTGRES_DB=tasksdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
    volumes:
      - task_data:/var/lib/postgresql/data
    restart: always

volumes:
  task_data:
